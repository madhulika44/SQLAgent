[pytest]
testpaths = tests
# Lets tests `import app...` when pytest is run from the backend/ folder.
pythonpath = .
markers =
    e2e: end-to-end tests that need SQL Server and an LLM API key (skipped automatically when unavailable)
# Skip the slow, quota-using end-to-end tests with:  pytest -m "not e2e"
filterwarnings =
    # Starlette's TestClient nags about httpx -> httpx2; harmless for our tests.
    ignore:Using `httpx` with `starlette.testclient` is deprecated

